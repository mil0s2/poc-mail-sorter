services:
  ollama:
    image: ollama/ollama:0.32.15
    init: true
    environment:
      OLLAMA_KEEP_ALIVE: 30m
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  ollama-init:
    image: ollama/ollama:0.32.15
    init: true
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "echo 'Pobieram model: ${OLLAMA_MODEL:-qwen2.5:3b}. Przy pierwszym uruchomieniu to ok. 2 GB.' &&
       ollama pull ${OLLAMA_MODEL:-qwen2.5:3b} &&
       echo 'Wczytuję wagi...' &&
       { ollama run ${OLLAMA_MODEL:-qwen2.5:3b} 'ok' > /dev/null 2>&1 ||
         echo 'Rozgrzewka nieudana - pierwsze zadanie bedzie wolniejsze.'; } &&
       echo 'Model gotowy i załadowany.'"
    restart: "no"

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

  api:
    build: .
    depends_on:
      ollama-init:
        condition: service_completed_successfully
      mailhog:
        condition: service_started
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      OLLAMA_BASE_URL: http://ollama:11434
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(''http://localhost:8000/api/v1/health'').status==200 else 1)"',
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  ollama-models:
